{% extends "base.html" %}
{% block title %}Log in — AI Live Interviewer{% endblock %}
{% block content %}
<div class="page-narrow">
  <div class="card">
    <h2>Log in</h2>
    {% if error %}<div class="error-box">{{ error }}</div>{% endif %}
    <form method="post" action="/login">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required placeholder="you@example.com" />

      <label for="password">Password</label>
      <input type="password" id="password" name="password" required />

      <button class="btn btn-block" type="submit" style="margin-top:24px;">Log in</button>
    </form>
    <p class="hint" style="margin-top:16px;">No account yet? <a href="/signup">Sign up</a></p>
  </div>
</div>
{% endblock %}
