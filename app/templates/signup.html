{% extends "base.html" %}
{% block title %}Sign up — AI Live Interviewer{% endblock %}
{% block content %}
<div class="page-narrow">
  <div class="card">
    <h2>Create your account</h2>
    {% if error %}<div class="error-box">{{ error }}</div>{% endif %}
    <form method="post" action="/signup">
      <label for="full_name">Full name (optional)</label>
      <input type="text" id="full_name" name="full_name" placeholder="Jane Doe" />

      <label for="email">Email</label>
      <input type="email" id="email" name="email" required placeholder="you@example.com" />

      <label for="password">Password</label>
      <input type="password" id="password" name="password" required minlength="6" />

      <button class="btn btn-block" type="submit" style="margin-top:24px;">Create account</button>
    </form>
    <p class="hint" style="margin-top:16px;">Already have an account? <a href="/login">Log in</a></p>
  </div>
</div>
{% endblock %}
